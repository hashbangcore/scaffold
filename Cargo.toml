[package]
name = "scaffold-cli"
version = "0.1.0"
edition = "2024"
description = "Scaffold manager"
authors = ["Hash <hashbangcore@duck.com>"]
categories = ["command-line-utilities"]
keywords = ["cli", "scaffold"]
license = "BSD-2-Clause"
repository = "https://github.com/hashbangcore/scaffold"

[[bin]]
name = "scaffold"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
globset = "0.4"
serde_json = "1"

[[test]]
name = "integration"
path = "test/integration.rs"
